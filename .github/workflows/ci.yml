name: ci

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "docs-src/**"
      - "editors/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: ${{ matrix.image }} x86_64
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [debian:stable, alpine:latest]
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD":/src -w /src ${{ matrix.image }} sh -c "sh scripts/install-deps.sh && bash ./bootstrap.sh"

  linux:
    if: github.event_name == 'workflow_dispatch'
    name: ${{ matrix.image }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]
        runner: [ubuntu-latest]
        image: [ubuntu:24.04, fedora:latest, archlinux:latest, opensuse/tumbleweed]
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: debian:stable
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: alpine:latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD":/src -w /src ${{ matrix.image }} sh -c "sh scripts/install-deps.sh && bash ./bootstrap.sh"

  macos:
    if: github.event_name == 'workflow_dispatch'
    name: macos ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - run: ./bootstrap.sh

  windows:
    if: github.event_name == 'workflow_dispatch'
    name: windows wsl
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Vampire/setup-wsl@v5
        with:
          distribution: Ubuntu-24.04
          use-cache: true
      - shell: wsl-bash {0}
        run: sh scripts/install-deps.sh && bash ./bootstrap.sh
