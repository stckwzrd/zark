name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    name: ${{ matrix.image }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]
        runner: [ubuntu-latest]
        image: [debian:stable, ubuntu:24.04, fedora:latest, archlinux:latest, alpine:latest, opensuse/tumbleweed]
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: debian:stable
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: alpine:latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD":/src -w /src ${{ matrix.image }} sh -c "sh scripts/install-deps.sh && bash ./bootstrap.sh"

  macos:
    name: macos ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - run: ./bootstrap.sh

  windows:
    name: windows wsl
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Vampire/setup-wsl@v5
        with:
          distribution: Ubuntu-24.04
          use-cache: true
      - shell: wsl-bash {0}
        run: sh scripts/install-deps.sh && bash ./bootstrap.sh
