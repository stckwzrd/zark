name: ci

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "docs-src/**"
      - "editors/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [all, arm64, macos, linux]
        default: all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'linux'
    name: ${{ matrix.image }} x86_64
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [debian:stable, alpine:latest]
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD":/src -w /src ${{ matrix.image }} sh -c "sh scripts/install-deps.sh && bash ./bootstrap.sh"

  linux:
    if: github.event_name == 'workflow_dispatch' && (inputs.scope == 'all' || inputs.scope == 'linux')
    name: ${{ matrix.image }} x86_64
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:24.04, fedora:latest, archlinux:latest, opensuse/tumbleweed]
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD":/src -w /src ${{ matrix.image }} sh -c "sh scripts/install-deps.sh && bash ./bootstrap.sh"

  arm64:
    if: github.event_name == 'workflow_dispatch' && (inputs.scope == 'all' || inputs.scope == 'linux' || inputs.scope == 'arm64')
    name: ${{ matrix.image }} aarch64
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        image: [debian:stable, alpine:latest]
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD":/src -w /src ${{ matrix.image }} sh -c "sh scripts/install-deps.sh && bash ./bootstrap.sh"

  macos:
    if: github.event_name == 'workflow_dispatch' && (inputs.scope == 'all' || inputs.scope == 'macos')
    name: macos ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - run: ./bootstrap.sh

  windows:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'all'
    name: windows wsl
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Vampire/setup-wsl@v5
        with:
          distribution: Ubuntu-24.04
          use-cache: true
      - shell: wsl-bash {0}
        run: sh scripts/install-deps.sh && bash ./bootstrap.sh
