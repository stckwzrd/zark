name: ci-selfhosted

# Run the Linux tests on a machine you own instead of a GitHub-hosted runner.
# Self-hosted runners do not consume GitHub Actions minutes.
#
# Setup on the Fedora machine:
#   mkdir -p ~/actions-runner && cd ~/actions-runner
#   curl -LO https://github.com/actions/runner/releases/download/vX.Y.Z/actions-runner-linux-x64-X.Y.Z.tar.gz
#   tar xzf actions-runner-linux-x64-*.tar.gz
#   gh api -X POST repos/stckwzrd/zark/actions/runners/registration-token --jq .token
#   ./config.sh --url https://github.com/stckwzrd/zark --token <TOKEN> \
#       --labels self-hosted,linux,x64,fedora --unattended
#   sudo ./svc.sh install "$USER" && sudo ./svc.sh start
#
# Prerequisites on the host: clang, binutils, diffutils, gzip, make, bash, git,
# python3 (sh scripts/install-deps.sh installs them), qemu-system-x86_64 for
# the baremetal test, and docker for the container jobs (add the runner user to
# the docker group). The `fedora` label selects the native job.
#
# The container, arm64 and cross jobs only run on workflow_dispatch: they are
# slow (a full bootstrap per image) and would otherwise fire on every push.
# macOS and Windows need Apple/Windows hosts and stay in ci.yml.

on:
  push:
    branches: [language-fixes]
    paths-ignore:
      - "docs/**"
      - "docs-src/**"
      - "editors/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "docs-src/**"
      - "editors/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [all, native, containers, arm64, cross]
        default: all

# A manual run must not be cancelled by a push that lands while it is running.
concurrency:
  group: ci-selfhosted-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  native:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || inputs.scope == 'all' || inputs.scope == 'native'
    name: fedora native
    runs-on: [self-hosted, linux, x64, fedora]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: ./bootstrap.sh

  containers:
    if: github.event_name == 'workflow_dispatch' && (inputs.scope == 'all' || inputs.scope == 'containers')
    name: ${{ matrix.image }} x86_64
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        image:
          - fedora:latest
          - debian:stable
          - alpine:latest
          - ubuntu:24.04
          - archlinux:latest
          - opensuse/tumbleweed
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the ${{ matrix.image }} image
        run: |
          set -eu
          tag="zark-ci-$(printf '%s' '${{ matrix.image }}' | tr '/:' '--')"
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          cp scripts/install-deps.sh "$dir/install-deps.sh"
          {
            echo "FROM ${{ matrix.image }}"
            echo "COPY install-deps.sh /tmp/install-deps.sh"
            echo "RUN sh /tmp/install-deps.sh"
          } > "$dir/Dockerfile"
          docker build -t "$tag" "$dir"
          echo "ZARK_CI_IMAGE=$tag" >> "$GITHUB_ENV"
      - name: Bootstrap inside the container
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD":/src:z -w /src \
            "$ZARK_CI_IMAGE" bash ./bootstrap.sh

  arm64:
    if: github.event_name == 'workflow_dispatch' && (inputs.scope == 'all' || inputs.scope == 'arm64')
    name: ${{ matrix.image }} aarch64 (qemu)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        image: [debian:stable, alpine:latest]
    steps:
      - uses: actions/checkout@v4
      - name: Register the arm64 emulator
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64
      - name: Prepare the ${{ matrix.image }} aarch64 image
        run: |
          set -eu
          tag="zark-ci-$(printf '%s' '${{ matrix.image }}' | tr '/:' '--')-arm64"
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          cp scripts/install-deps.sh "$dir/install-deps.sh"
          {
            echo "FROM --platform=linux/arm64 ${{ matrix.image }}"
            echo "COPY install-deps.sh /tmp/install-deps.sh"
            echo "RUN sh /tmp/install-deps.sh"
          } > "$dir/Dockerfile"
          docker build --platform linux/arm64 -t "$tag" "$dir"
          echo "ZARK_CI_IMAGE=$tag" >> "$GITHUB_ENV"
      - name: Bootstrap under qemu-user
        run: |
          docker run --rm --platform linux/arm64 \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD":/src:z -w /src \
            "$ZARK_CI_IMAGE" bash ./bootstrap.sh

  # The macOS and Windows jobs in ci.yml cannot run here (they need Apple and
  # Windows hosts). What can be checked locally is that the compiler emits IR
  # for those targets at all, using a seed-built compiler.
  cross:
    if: github.event_name == 'workflow_dispatch' && (inputs.scope == 'all' || inputs.scope == 'cross')
    name: cross IR ${{ matrix.arch }}-${{ matrix.os }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            os: linux
          - arch: aarch64
            os: macos
          - arch: x86_64
            os: macos
    steps:
      - uses: actions/checkout@v4
      - name: Build the compiler from the seed
        run: |
          set -eu
          mkdir -p build
          gzip -dc bootstrap/seed.ll.gz > build/seed.ll
          clang -O1 -Wno-override-module build/seed.ll std/rt.c -o build/seed -lm -lpthread -ldl
          build/seed build selfhost/main.zk --release -o build/zark
      - name: Emit IR for the target
        run: build/zark ir selfhost/main.zk --arch ${{ matrix.arch }} --os ${{ matrix.os }} > /dev/null
